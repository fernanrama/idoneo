<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" class="marks" width="1288" height="768" viewBox="0 0 1288 768"><rect width="1288" height="768" fill="#f8fafc"/><g fill="none" stroke-miterlimit="4" transform="translate(24,24)"><g class="mark-group role-frame root" role="graphics-object" aria-roledescription="group mark container"><g transform="translate(0,0)"><path class="background" aria-hidden="true" d="M0,0h1240v720h-1240Z"/><g><g class="mark-text role-mark" role="graphics-object" aria-roledescription="text mark container"><text text-anchor="start" transform="translate(35,28)" font-family="Inter, Arial, sans-serif" font-size="28px" font-weight="700" fill="#0f172a">Flujo del agente y memoria por usuario</text></g><g class="mark-text role-mark" role="graphics-object" aria-roledescription="text mark container"><text text-anchor="start" transform="translate(35,58)" font-family="Inter, Arial, sans-serif" font-size="16px" fill="#475569">El perfil MiFID existente no se convierte en memoria: ambas capas se guardan y consumen por separado.</text></g><g class="mark-path role-mark" role="graphics-symbol" aria-roledescription="path mark container"><path transform="translate(0,0)" d="M215,317 L285,317" stroke="#64748b" stroke-width="2.5"/><path transform="translate(0,0)" d="M465,317 L535,317" stroke="#64748b" stroke-width="2.5"/><path transform="translate(0,0)" d="M715,317 L785,317" stroke="#64748b" stroke-width="2.5"/><path transform="translate(0,0)" d="M965,290 C1010,260 1010,200 1035,170" stroke="#64748b" stroke-width="2.5"/><path transform="translate(0,0)" d="M1035,140 C820,25 620,70 625,265" stroke="#64748b" stroke-width="2.5"/><path transform="translate(0,0)" d="M1035,495 C850,635 650,570 625,370" stroke="#64748b" stroke-width="2.5"/><path transform="translate(0,0)" d="M190,370 C300,610 720,665 1035,525" stroke="#64748b" stroke-width="2.5"/></g><g class="mark-text role-mark" role="graphics-object" aria-roledescription="text mark container"><text text-anchor="middle" transform="translate(250,300)" font-family="Inter, Arial, sans-serif" font-size="12px" font-weight="600" fill="#475569">inicia</text><text text-anchor="middle" transform="translate(500,300)" font-family="Inter, Arial, sans-serif" font-size="12px" font-weight="600" fill="#475569">contexto</text><text text-anchor="middle" transform="translate(750,300)" font-family="Inter, Arial, sans-serif" font-size="12px" font-weight="600" fill="#475569">turnos</text><text text-anchor="middle" transform="translate(995,235)" font-family="Inter, Arial, sans-serif" font-size="12px" font-weight="600" fill="#475569">escribe versión</text><text text-anchor="middle" transform="translate(815,72)" font-family="Inter, Arial, sans-serif" font-size="12px" font-weight="600" fill="#475569">pendientes del perfil</text><text text-anchor="middle" transform="translate(815,600)" font-family="Inter, Arial, sans-serif" font-size="12px" font-weight="600" fill="#475569">solo contexto personal</text><text text-anchor="middle" transform="translate(500,642)" font-family="Inter, Arial, sans-serif" font-size="12px" font-weight="600" fill="#475569">PUT/DELETE explícito con consentimiento</text></g><g class="mark-rect role-mark" role="graphics-symbol" aria-roledescription="rect mark container"><path d="M49,265L201,265C208.726810342916,265,215,271.273189657084,215,279L215,356C215,363.726810342916,208.726810342916,370,201,370L49,370C41.273189657084004,370,35,363.726810342916,35,356L35,279C35,271.273189657084,41.273189657084004,265,49,265Z" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><path d="M299,265L451,265C458.726810342916,265,465,271.273189657084,465,279L465,356C465,363.726810342916,458.726810342916,370,451,370L299,370C291.273189657084,370,285,363.726810342916,285,356L285,279C285,271.273189657084,291.273189657084,265,299,265Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><path d="M549,265L701,265C708.726810342916,265,715,271.273189657084,715,279L715,356C715,363.726810342916,708.726810342916,370,701,370L549,370C541.273189657084,370,535,363.726810342916,535,356L535,279C535,271.273189657084,541.273189657084,265,549,265Z" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><path d="M799,265L951,265C958.726810342916,265,965,271.273189657084,965,279L965,356C965,363.726810342916,958.726810342916,370,951,370L799,370C791.273189657084,370,785,363.726810342916,785,356L785,279C785,271.273189657084,791.273189657084,265,799,265Z" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><path d="M1049,90L1201,90C1208.726810342916,90,1215,96.273189657084,1215,104L1215,201C1215,208.726810342916,1208.726810342916,215,1201,215L1049,215C1041.273189657084,215,1035,208.726810342916,1035,201L1035,104C1035,96.273189657084,1041.273189657084,90,1049,90Z" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><path d="M1049,440L1201,440C1208.726810342916,440,1215,446.273189657084,1215,454L1215,551C1215,558.726810342916,1208.726810342916,565,1201,565L1049,565C1041.273189657084,565,1035,558.726810342916,1035,551L1035,454C1035,446.273189657084,1041.273189657084,440,1049,440Z" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/></g><g class="mark-text role-mark" role="graphics-object" aria-roledescription="text mark container"><text text-anchor="middle" transform="translate(125,295)" font-family="Inter, Arial, sans-serif" font-size="16px" font-weight="700" fill="#0f172a">Cliente + frontend</text><text text-anchor="middle" transform="translate(375,295)" font-family="Inter, Arial, sans-serif" font-size="16px" font-weight="700" fill="#0f172a">API de sesión</text><text text-anchor="middle" transform="translate(625,295)" font-family="Inter, Arial, sans-serif" font-size="16px" font-weight="700" fill="#0f172a">Agente entrevistador</text><text text-anchor="middle" transform="translate(875,295)" font-family="Inter, Arial, sans-serif" font-size="16px" font-weight="700" fill="#0f172a">Claude + extractor</text><text text-anchor="middle" transform="translate(1125,120)" font-family="Inter, Arial, sans-serif" font-size="16px" font-weight="700" fill="#0f172a">Perfil MiFID</text><text text-anchor="middle" transform="translate(1125,470)" font-family="Inter, Arial, sans-serif" font-size="16px" font-weight="700" fill="#0f172a">Memoria personal</text></g><g class="mark-text role-mark" role="graphics-object" aria-roledescription="text mark container"><text text-anchor="middle" transform="translate(125,323)" font-family="Inter, Arial, sans-serif" font-size="13px" fill="#334155"><tspan>Voz, texto y controles</tspan><tspan x="0" dy="18">de memoria</tspan></text><text text-anchor="middle" transform="translate(375,323)" font-family="Inter, Arial, sans-serif" font-size="13px" fill="#334155"><tspan>Bootstrap, turnos,</tspan><tspan x="0" dy="18">pending y consentimiento</tspan></text><text text-anchor="middle" transform="translate(625,323)" font-family="Inter, Arial, sans-serif" font-size="13px" fill="#334155"><tspan>ElevenLabs o chat</tspan><tspan x="0" dy="18">Pregunta, no recomienda</tspan></text><text text-anchor="middle" transform="translate(875,323)" font-family="Inter, Arial, sans-serif" font-size="13px" fill="#334155"><tspan>Extrae evidencias, valida</tspan><tspan x="0" dy="18">y versiona el perfil</tspan></text><text text-anchor="middle" transform="translate(1125,148)" font-family="Inter, Arial, sans-serif" font-size="13px" fill="#334155"><tspan>Datos regulatorios</tspan><tspan x="0" dy="18">versionados + evidencia</tspan><tspan x="0" dy="18">Fuente de verdad</tspan></text><text text-anchor="middle" transform="translate(1125,498)" font-family="Inter, Arial, sans-serif" font-size="13px" fill="#334155"><tspan>Preferencias consentidas</tspan><tspan x="0" dy="18">editables y borrables</tspan><tspan x="0" dy="18">Capa independiente</tspan></text></g><g class="mark-rect role-mark" role="graphics-symbol" aria-roledescription="rect mark container"><path d="M45,655L1205,655C1210.51915024494,655,1215,659.48084975506,1215,665L1215,690C1215,695.51915024494,1210.51915024494,700,1205,700L45,700C39.48084975506,700,35,695.51915024494,35,690L35,665C35,659.48084975506,39.48084975506,655,45,655Z" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/></g><g class="mark-text role-mark" role="graphics-object" aria-roledescription="text mark container"><text text-anchor="middle" transform="translate(625,683)" font-family="Inter, Arial, sans-serif" font-size="14px" font-weight="700" fill="#be123c">Límite deliberado: el extractor no recibe la memoria y la transcripción nunca se guarda automáticamente como memoria.</text></g></g><path class="foreground" aria-hidden="true" d="" display="none"/></g></g></g></svg>