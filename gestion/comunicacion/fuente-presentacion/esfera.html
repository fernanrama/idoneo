<!doctype html>
<html><head><meta charset="utf-8">
<style>
  /* Fondo transparente: la esfera se pega luego sobre el fondo oscuro de la diapositiva */
  html, body { margin: 0; background: transparent; }
  #caja { position: relative; width: 1000px; height: 1000px; }
  /* Halo suave alrededor, como en la web (CSS por debajo del lienzo) */
  #halo { position: absolute; inset: 0; border-radius: 50%;
          background: radial-gradient(circle, var(--h) 0%, transparent 68%); }
  canvas { position: absolute; left: 150px; top: 150px; width: 700px; height: 700px; }
</style></head>
<body>
<div id="caja"><div id="halo"></div><canvas id="c" width="700" height="700"></canvas></div>
<script>
// Mismo shader que frontend/src/components/Esfera3D.tsx, pintado UNA vez en un instante fijo.
const q = new URLSearchParams(location.search);
const pal = (q.get("p") || "1f3bff,8a5cff,ff7fd1").split(",");
const T = parseFloat(q.get("t") || "7.3"), AMP = parseFloat(q.get("e") || "0.6");
document.getElementById("halo").style.setProperty("--h", q.get("h") || "rgba(138,92,255,0.35)");
const FRAG = `
precision highp float;
uniform vec2 uRes; uniform float uT; uniform float uAmp; uniform float uSat; uniform float uPulso;
uniform vec3 uA; uniform vec3 uB; uniform vec3 uC; uniform vec2 uRaton;
vec4 perm(vec4 x){ return mod(((x * 34.0) + 1.0) * x, 289.0); }
float ruido(vec3 p){
  vec3 a = floor(p); vec3 d = p - a; d = d * d * (3.0 - 2.0 * d);
  vec4 b = a.xxyy + vec4(0.0, 1.0, 0.0, 1.0);
  vec4 k1 = perm(b.xyxy); vec4 k2 = perm(k1.xyxy + b.zzww);
  vec4 c = k2 + a.zzzz; vec4 k3 = perm(c); vec4 k4 = perm(c + 1.0);
  vec4 o1 = fract(k3 / 41.0); vec4 o2 = fract(k4 / 41.0);
  vec4 o3 = o2 * d.z + o1 * (1.0 - d.z);
  vec2 o4 = o3.yw * d.x + o3.xz * (1.0 - d.x);
  return o4.y * d.y + o4.x * (1.0 - d.y);
}
float fbm(vec3 p){ float v = 0.0; float a = 0.5;
  for (int i = 0; i < 4; i++) { v += a * ruido(p); p = p * 2.03 + vec3(11.3, 4.7, 7.1); a *= 0.5; } return v; }
mat2 giro(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
void main(){
  vec2 p = (gl_FragCoord.xy * 2.0 - uRes) / min(uRes.x, uRes.y);
  p *= 1.04 + 0.02 * uPulso * sin(uT * 9.0);
  float r = length(p);
  if (r > 1.0) { gl_FragColor = vec4(0.0); return; }
  float z = sqrt(1.0 - r * r);
  vec3 n = vec3(p, z); vec3 q = n;
  q.xz = giro(uT * 0.22 + uRaton.x * 0.5) * q.xz;
  q.yz = giro(0.35 + uRaton.y * 0.4) * q.yz;
  q *= 0.95;
  vec3 w1 = vec3(fbm(q + vec3(0.0, 0.0, uT * 0.30)), fbm(q + vec3(5.2, 1.3, -uT * 0.26)), fbm(q + vec3(2.1, 7.7, uT * 0.22)));
  vec3 q2 = q + uAmp * 2.4 * (w1 - 0.5);
  float f = fbm(q2 * 1.25 + vec3(0.0, uT * 0.12, 0.0));
  float g = fbm(q2 * 2.0 - vec3(uT * 0.18, 0.0, 0.0));
  vec3 col = mix(uA, uB, smoothstep(0.22, 0.74, f));
  col = mix(col, uC, smoothstep(0.42, 0.9, g) * 0.8);
  float hilo = pow(1.0 - abs(f - 0.5) * 2.0, 7.0);
  col += hilo * 0.28 * mix(uC, vec3(1.0), 0.5);
  float fres = pow(1.0 - z, 2.2);
  col *= 0.7 + 0.3 * z;
  col += fres * mix(uB, vec3(1.0), 0.35) * 0.8;
  vec3 luz = normalize(vec3(-0.55, 0.62, 0.56));
  float e = max(dot(n, luz), 0.0);
  col += pow(e, 48.0) * 0.95 + pow(e, 7.0) * 0.16;
  float abajo = max(dot(n, normalize(vec3(0.5, -0.7, 0.5))), 0.0);
  col += pow(abajo, 14.0) * 0.18 * uC;
  float alfa = smoothstep(1.0, 0.975, r);
  gl_FragColor = vec4(col * alfa, alfa);
}`;
const c = document.getElementById("c");
const gl = c.getContext("webgl", { premultipliedAlpha: true, preserveDrawingBuffer: true, antialias: true });
const sh = (t, s) => { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); return x; };
const pr = gl.createProgram();
gl.attachShader(pr, sh(gl.VERTEX_SHADER, "attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }"));
gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(pr); gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const pos = gl.getAttribLocation(pr, "p"); gl.enableVertexAttribArray(pos); gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
const U = (n) => gl.getUniformLocation(pr, n);
const rgb = (h) => { const n = parseInt(h, 16); return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255]; };
gl.viewport(0, 0, 700, 700);
gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
gl.uniform2f(U("uRes"), 700, 700); gl.uniform1f(U("uT"), T); gl.uniform1f(U("uAmp"), AMP);
gl.uniform1f(U("uSat"), 1); gl.uniform1f(U("uPulso"), 0); gl.uniform2f(U("uRaton"), 0, 0);
gl.uniform3fv(U("uA"), rgb(pal[0])); gl.uniform3fv(U("uB"), rgb(pal[1])); gl.uniform3fv(U("uC"), rgb(pal[2]));
gl.drawArrays(gl.TRIANGLES, 0, 3);
</script>
</body></html>
